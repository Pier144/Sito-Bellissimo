<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Anime Runner</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0618">
<style>
  :root {
    --ink: #0d0618;
    --violet: #8b5cff;
    --cyan: #5ee7ff;
    --gold: #ffd25e;
    --red: #ff3b5c;
    --top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 16px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
    background: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  button { font: inherit; color: inherit; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* titoli in stile anime: corsivo pesante con contorno */
  .title {
    margin: 0;
    font: italic 900 38px/1 "Arial Black", "Segoe UI", sans-serif;
    text-transform: uppercase; letter-spacing: 1px;
    color: #fff;
    -webkit-text-stroke: 1.5px var(--ink);
    text-shadow: 3px 3px 0 var(--violet), 6px 6px 0 rgba(0,0,0,.5);
  }

  .screen {
    position: fixed; inset: 0; z-index: 100;
    display: none; overflow-y: auto; touch-action: pan-y;
    padding: calc(16px + var(--top)) 16px 24px;
  }
  .screen.on { display: block; }
  .center { display: none; align-items: center; justify-content: center; }
  .center.on { display: flex; }

  /* --- album --- */
  #album { background: linear-gradient(rgba(13,6,24,.55), rgba(13,6,24,.92) 40%); }
  #album header { text-align: center; margin: 4px 0 16px; }
  #album header p { margin: 10px 0 0; opacity: .85; }
  #album .count {
    display: inline-block; margin-top: 10px; padding: 4px 14px; border-radius: 99px;
    background: rgba(255,210,94,.15); border: 1px solid var(--gold); color: var(--gold);
    font-weight: 800; letter-spacing: 1px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    max-width: 520px; margin: 0 auto;
  }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(5, 1fr); max-width: 900px; } }
  .slot {
    position: relative; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden;
    border: 2px solid rgba(255,255,255,.12);
    background: linear-gradient(160deg, #241338, #120a1e);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 10px; text-align: center; cursor: default;
  }
  .slot .who { font: italic 900 15px/1.1 "Arial Black", sans-serif; text-transform: uppercase; }
  .slot .from { font-size: 12px; opacity: .7; margin-top: 2px; }
  .slot .mark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font: italic 900 64px/1 "Arial Black", sans-serif; color: rgba(255,255,255,.08);
  }
  .slot.soon { opacity: .55; }
  .slot.locked .mark { font-size: 40px; color: rgba(255,255,255,.25); }
  .slot.play {
    cursor: pointer; border-color: var(--violet);
    box-shadow: 0 0 0 2px rgba(139,92,255,.25), 0 0 24px rgba(139,92,255,.45);
    animation: glow 1.6s ease-in-out infinite;
  }
  .slot.play .mark { color: rgba(139,92,255,.35); }
  .slot .badge {
    position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
    background: var(--violet);
  }
  .slot.won { cursor: pointer; border-color: var(--gold); box-shadow: 0 0 18px rgba(255,210,94,.35); }
  .slot.won .badge { background: var(--gold); color: var(--ink); }
  .slot.won::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(transparent 55%, rgba(0,0,0,.85));
  }
  .slot.won .who, .slot.won .from { position: relative; z-index: 1; }
  .slot img, .face img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top;
    -webkit-user-drag: none;
  }
  .slot.fresh { animation: fresh 1s ease-out 2; }
  @keyframes glow { 50% { box-shadow: 0 0 0 2px rgba(139,92,255,.4), 0 0 36px rgba(139,92,255,.7); } }
  @keyframes fresh { 50% { transform: scale(1.06); box-shadow: 0 0 40px var(--gold); } }

  /* --- schede (briefing, sconfitta) --- */
  .panel {
    width: 100%; max-width: 420px;
    background: linear-gradient(170deg, rgba(36,19,56,.97), rgba(16,9,28,.97));
    border: 2px solid var(--violet); border-radius: 18px;
    padding: 22px 18px; text-align: center;
    box-shadow: 0 0 40px rgba(139,92,255,.35);
    animation: drop .45s cubic-bezier(.2, 1.5, .4, 1) both;
  }
  @keyframes drop { from { transform: translateY(-40px) scale(.9); opacity: 0; } }
  .panel .lv { font-weight: 900; letter-spacing: 3px; color: var(--cyan); font-size: 13px; text-transform: uppercase; }
  .panel .title { font-size: 32px; margin: 6px 0 2px; }
  .panel .sub { opacity: .75; font-size: 14px; }
  .panel p { margin: 14px 0; }
  .rules { text-align: left; margin: 14px 0 18px; padding: 0; list-style: none; font-size: 15px; }
  .rules li { padding: 6px 0 6px 30px; position: relative; border-top: 1px solid rgba(255,255,255,.07); }
  .rules li span { position: absolute; left: 0; width: 24px; text-align: center; }
  .cta {
    display: block; width: 100%;
    font: italic 900 22px/1 "Arial Black", sans-serif; text-transform: uppercase; letter-spacing: 1px;
    color: #fff; background: linear-gradient(135deg, #a77bff, #6a3cff 60%, #4b1fd6);
    border: 0; border-radius: 14px; padding: 16px; cursor: pointer;
    box-shadow: 0 5px 0 #2d0f8a, 0 0 24px rgba(139,92,255,.5);
    animation: pump 1.2s ease-in-out infinite;
  }
  .cta:active { transform: translateY(4px); box-shadow: 0 1px 0 #2d0f8a; }
  @keyframes pump { 50% { transform: scale(1.03); } }
  .link {
    display: block; width: 100%; margin-top: 12px; padding: 10px;
    background: none; border: 0; cursor: pointer; opacity: .75; font-weight: 700;
  }
  .ghost {
    display: block; width: 100%; margin-top: 10px; padding: 13px;
    border: 2px solid rgba(255,255,255,.3); border-radius: 14px; background: rgba(255,255,255,.05);
    font-weight: 800; cursor: pointer;
  }
  #brief, #over, #pause { background: rgba(13,6,24,.6); }

  /* --- HUD --- */
  #hud {
    position: fixed; left: 0; right: 0; top: 0; z-index: 50;
    padding: calc(10px + var(--top)) 14px 0;
    display: none; pointer-events: none;
    font-weight: 900; text-shadow: 0 2px 0 #000, 0 0 6px rgba(0,0,0,.7);
  }
  #hud.on { display: block; }
  #hud .row { display: flex; align-items: center; gap: 12px; }
  #lives { font-size: 22px; letter-spacing: 2px; color: var(--red); min-width: 74px; }
  #lives i { font-style: normal; opacity: .25; }
  #lives i.on { opacity: 1; }
  #prog { flex: 1; height: 8px; border-radius: 9px; background: rgba(255,255,255,.18); overflow: hidden; }
  #prog b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--violet)); }
  #frags { font-size: 20px; color: var(--gold); min-width: 74px; text-align: right; }
  #power {
    margin: 10px auto 0; width: 190px; text-align: center; font-size: 13px; letter-spacing: 1px;
    text-transform: uppercase; display: none;
  }
  #power.on { display: block; }
  #power .bar { height: 5px; border-radius: 5px; background: rgba(255,255,255,.2); margin-top: 4px; overflow: hidden; }
  #power .bar b { display: block; height: 100%; background: var(--cyan); }
  #bossbar { display: none; margin-top: 10px; }
  #bossbar.on { display: block; }
  #bossbar .name { font: italic 900 14px/1 "Arial Black", sans-serif; letter-spacing: 2px; text-transform: uppercase; color: #ff9aa9; }
  #bossbar .bar { height: 12px; margin-top: 5px; border-radius: 4px; border: 2px solid #000; background: #2a0b12; overflow: hidden; }
  #bossbar .bar b { display: block; height: 100%; width: 100%; background: linear-gradient(#ff6b7f, #c4102e); transition: width .25s; }

  #msg {
    position: fixed; left: 0; right: 0; top: 34%; z-index: 60; pointer-events: none;
    text-align: center; padding: 0 16px;
    font: italic 900 30px/1.1 "Arial Black", sans-serif; text-transform: uppercase;
    -webkit-text-stroke: 1.5px var(--ink);
    text-shadow: 3px 3px 0 var(--violet), 0 0 18px rgba(0,0,0,.8);
    opacity: 0;
  }
  #msg.on { animation: msg 1.4s ease-out forwards; }
  #msg small { display: block; font-size: 15px; -webkit-text-stroke: 0; letter-spacing: 2px; margin-bottom: 6px; color: var(--cyan); }
  @keyframes msg {
    0% { opacity: 0; transform: scale(1.8); }
    12% { opacity: 1; transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-20px); }
  }

  /* --- mossa finale --- */
  #finisher {
    position: fixed; inset: 0; z-index: 200; display: none;
    align-items: center; justify-content: center; flex-direction: column; text-align: center;
    padding: 16px; overflow: hidden;
  }
  #finisher.on { display: flex; }
  #finisher.void {
    background:
      radial-gradient(circle at 50% 50%, #fff 0 2%, #b9f3ff 4%, #3a7bff 12%, #1b0b4a 30%, #05010d 60%);
    animation: void 2.8s ease-out both;
  }
  #finisher.arise {
    background: radial-gradient(circle at 50% 60%, #5b21b6 0%, #1b0636 45%, #000 80%);
    animation: void 2.8s ease-out both;
  }
  #finisher .small { font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: var(--cyan); }
  #finisher .big {
    font: italic 900 54px/1 "Arial Black", sans-serif; text-transform: uppercase; margin-top: 10px;
    -webkit-text-stroke: 2px #000; text-shadow: 0 0 30px #fff, 4px 4px 0 var(--violet);
    animation: slam .6s cubic-bezier(.2, 1.6, .4, 1) .3s both;
  }
  #finisher.arise .big { font-size: min(76px, 19vw); text-shadow: 0 0 40px #a78bfa, 5px 5px 0 #000; animation: slam .6s cubic-bezier(.2, 1.6, .4, 1) .3s both, quake .12s linear .9s 12; }
  #finisher .stars { position: absolute; inset: 0; pointer-events: none; }
  @keyframes void { from { opacity: 0; transform: scale(1.3); } 15% { opacity: 1; transform: scale(1); } }
  @keyframes slam { from { transform: scale(3); opacity: 0; } }
  @keyframes quake { 50% { transform: translate(3px, -3px); } }

  /* --- carta ottenuta --- */
  #reveal {
    position: fixed; inset: 0; z-index: 300; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    padding: 16px; background: radial-gradient(circle, rgba(60,30,110,.9), rgba(5,2,12,.97) 70%);
  }
  #reveal.on { display: flex; }
  #reveal .got { font: italic 900 30px/1.1 "Arial Black", sans-serif; color: var(--gold); text-transform: uppercase; margin-bottom: 18px; text-align: center;
    text-shadow: 0 0 20px rgba(255,210,94,.6); animation: drop .5s .9s both; }
  .flip { width: min(68vw, 300px); aspect-ratio: 3 / 4; perspective: 1000px; }
  .flip .inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; animation: flip 1.1s cubic-bezier(.3, 1.4, .5, 1) .3s both;
  }
  .flip .side {
    position: absolute; inset: 0; border-radius: 16px; overflow: hidden;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border: 3px solid var(--gold); box-shadow: 0 0 50px rgba(255,210,94,.5);
  }
  .flip .back {
    background: repeating-linear-gradient(45deg, #3b1d75 0 12px, #2a1258 12px 24px);
    display: flex; align-items: center; justify-content: center;
    font: italic 900 70px/1 "Arial Black", sans-serif; color: var(--gold);
  }
  .flip .face { transform: rotateY(180deg); background: linear-gradient(160deg, #3b1d75, #120a1e); }
  .flip .face .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 12px 12px; text-align: center;
    background: linear-gradient(transparent, rgba(0,0,0,.9));
  }
  .flip .face .cap b { display: block; font: italic 900 22px/1.1 "Arial Black", sans-serif; text-transform: uppercase; }
  .flip .face .cap span { font-size: 13px; opacity: .8; }
  .flip .face .shine {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 45%, transparent 60%);
    background-size: 250% 100%; animation: shine 2.2s ease-in-out 1.4s infinite;
  }
  @keyframes flip { from { transform: rotateY(0) scale(.6); } to { transform: rotateY(180deg) scale(1); } }
  @keyframes shine { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  #reveal .cta { max-width: 300px; margin-top: 22px; animation: drop .5s 1.4s both; }

  /* senza foto: iniziali su fondo colorato */
  .initials {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font: italic 900 72px/1 "Arial Black", sans-serif; color: rgba(255,255,255,.85);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="row">
    <span id="lives"></span>
    <span id="prog"><b></b></span>
    <span id="frags">◆ 0/10</span>
  </div>
  <div id="power"><span class="label"></span><div class="bar"><b></b></div></div>
  <div id="bossbar"><div class="name"></div><div class="bar"><b></b></div></div>
</div>
<div id="msg"></div>

<section id="album" class="screen on">
  <header>
    <h1 class="title">Anime Runner</h1>
    <p>Colleziona i 10 personaggi anime più fighi</p>
    <span class="count" id="count">0 / 10</span>
  </header>
  <div class="grid" id="grid"></div>
</section>

<section id="brief" class="screen center">
  <div class="panel">
    <div class="lv" id="bLv"></div>
    <h2 class="title" id="bName"></h2>
    <div class="sub" id="bFrom"></div>
    <p id="bStory"></p>
    <ul class="rules" id="bRules"></ul>
    <button class="cta" id="bGo">Tocca per iniziare</button>
    <button class="link" id="bBack">← Album</button>
  </div>
</section>

<section id="over" class="screen center">
  <div class="panel">
    <h2 class="title" id="oTitle"></h2>
    <p id="oText"></p>
    <button class="cta" id="oRetry"></button>
    <button class="ghost" id="oAlt"></button>
    <button class="link" id="oBack">← Album</button>
  </div>
</section>

<section id="pause" class="screen center">
  <div class="panel">
    <h2 class="title">Pausa</h2>
    <p>Rimetti il telefono come lo tieni per giocare.</p>
    <button class="cta" id="pGo">Riprendi</button>
  </div>
</section>

<div id="finisher"><canvas class="stars"></canvas><div class="small"></div><div class="big"></div></div>

<div id="reveal">
  <div class="got">Personaggio ottenuto!</div>
  <div class="flip"><div class="inner">
    <div class="side back">?</div>
    <div class="side face" id="rFace"></div>
  </div></div>
  <button class="cta" id="rGo">Continua</button>
</div>

<script src="game.js"></script>
</body>
</html>
