<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lezione di gruppo</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body {
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* il "video" e' verticale 9:16 come un reel: sul telefono riempie lo schermo,
     sul computer resta in mezzo con le bande nere ai lati */
  #player { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #scene { width: 100%; height: 100%; display: block; }
  #scene.shake { animation: shake .09s linear infinite; }
  @keyframes shake {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-6px, 4px); }
    50%  { transform: translate(5px, -5px); }
    75%  { transform: translate(-4px, -3px); }
    100% { transform: translate(0, 0); }
  }

  /* --- finta schermata d'attesa del video --- */
  #poster {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .45);
    cursor: pointer;
  }
  #poster .play {
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(0, 0, 0, .55);
    border: 2px solid rgba(255, 255, 255, .85);
    display: flex; align-items: center; justify-content: center;
  }
  #poster .play::after {
    content: ""; margin-left: 7px;
    border-style: solid; border-width: 18px 0 18px 30px;
    border-color: transparent transparent transparent #fff;
  }
  #poster.hidden, #replay.hidden { display: none; }

  /* --- barra del video --- */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0, 0, 0, .55));
    display: flex; align-items: center; gap: 10px;
    font-variant-numeric: tabular-nums; font-size: 13px;
    pointer-events: none;
  }
  #track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .3); overflow: hidden; }
  #fill { height: 100%; width: 0; background: #fff; }

  #replay {
    position: fixed; right: 14px; top: calc(14px + env(safe-area-inset-top));
    width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: rgba(0, 0, 0, .55); color: #fff;
    font-size: 24px; line-height: 44px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="player">
  <svg id="scene" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#efe7d6"/>
        <stop offset="1" stop-color="#e2d6bd"/>
      </linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#b98f61"/>
        <stop offset="1" stop-color="#d4ae7f"/>
      </linearGradient>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fc3ec"/>
        <stop offset="1" stop-color="#d8ecfa"/>
      </linearGradient>
      <radialGradient id="spot" gradientUnits="userSpaceOnUse" cx="450" cy="700" r="170">
        <stop offset=".55" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".62"/>
      </radialGradient>
      <clipPath id="floorClip"><rect x="0" y="640" width="900" height="960"/></clipPath>
    </defs>

    <!-- la camera: tutto quello che sta qui dentro si sposta e zooma insieme -->
    <g id="cam">
      <!-- parete -->
      <rect x="-600" y="-600" width="2100" height="1240" fill="url(#wall)"/>
      <rect x="-600" y="560" width="2100" height="80" fill="#cdbf9f"/>
      <rect x="-600" y="556" width="2100" height="6" fill="#b3a27e"/>

      <!-- finestre -->
      <g>
        <rect x="14" y="120" width="82" height="390" rx="4" fill="#f7f3ea"/>
        <rect x="22" y="128" width="66" height="374" fill="url(#sky)"/>
        <path d="M55 128v374M22 315h66" stroke="#f7f3ea" stroke-width="6"/>
        <rect x="804" y="120" width="82" height="390" rx="4" fill="#f7f3ea"/>
        <rect x="812" y="128" width="66" height="374" fill="url(#sky)"/>
        <path d="M845 128v374M812 315h66" stroke="#f7f3ea" stroke-width="6"/>
      </g>

      <!-- orologio -->
      <g transform="translate(450 82)">
        <circle r="40" fill="#fff" stroke="#333" stroke-width="5"/>
        <g stroke="#333" stroke-width="3" stroke-linecap="round">
          <path d="M0-33v6M0 33v-6M-33 0h6M33 0h-6"/>
        </g>
        <path id="hHour" d="M0 0v-18" stroke="#222" stroke-width="5" stroke-linecap="round"/>
        <path id="hMin" d="M0 0v-27" stroke="#222" stroke-width="3.5" stroke-linecap="round"/>
        <path id="hSec" d="M0 6v-32" stroke="#d0342c" stroke-width="1.6" stroke-linecap="round"/>
        <circle r="3" fill="#222"/>
      </g>

      <!-- lavagna -->
      <g>
        <rect x="128" y="150" width="644" height="300" rx="6" fill="#8a6440"/>
        <rect x="140" y="162" width="620" height="276" fill="#2f4a3c"/>
        <rect x="150" y="438" width="600" height="10" rx="3" fill="#a07a52"/>
        <rect x="560" y="430" width="34" height="9" rx="2" fill="#f2f0e6"/>
        <g fill="#f1f0e4" fill-opacity=".86" font-family="'Chalkboard SE','Comic Sans MS','Segoe Print',cursive">
          <text x="450" y="218" font-size="40" text-anchor="middle">Dinamiche di gruppo</text>
          <text x="450" y="262" font-size="24" text-anchor="middle">Lezione 7 · il cerchio di condivisione</text>
          <text x="176" y="330" font-size="24">io + gli altri = noi</text>
          <text x="176" y="372" font-size="22">ascolto → fiducia → apertura</text>
          <text x="176" y="414" font-size="20" fill-opacity=".6">NON CANCELLARE</text>
        </g>
        <g fill="none" stroke="#f1f0e4" stroke-opacity=".8" stroke-width="3">
          <ellipse cx="640" cy="360" rx="70" ry="44"/>
        </g>
        <g fill="#f1f0e4" fill-opacity=".8">
          <circle cx="640" cy="316" r="5"/><circle cx="700" cy="334" r="5"/><circle cx="710" cy="372" r="5"/>
          <circle cx="672" cy="400" r="5"/><circle cx="610" cy="402" r="5"/><circle cx="572" cy="370" r="5"/>
          <circle cx="580" cy="332" r="5"/>
        </g>
      </g>

      <!-- pavimento -->
      <rect x="-600" y="640" width="2100" height="1500" fill="url(#floor)"/>
      <g id="planks" clip-path="url(#floorClip)" stroke="#8c6a43" stroke-opacity=".35" stroke-width="2"></g>

      <!-- banchi spinti contro il muro per fare spazio al cerchio -->
      <g id="desks"></g>

      <!-- le persone (ordinate dal fondo verso chi sta davanti) -->
      <g id="people"></g>

      <!-- occhio di bue su di lei, compare al momento giusto -->
      <rect id="spotlight" x="-600" y="-600" width="2100" height="2800" fill="url(#spot)" opacity="0"/>
    </g>
  </svg>
</div>

<div id="bar"><span id="cur">0:00</span><div id="track"><div id="fill"></div></div><span id="tot">0:19</span></div>
<button id="replay" class="hidden" aria-label="Guarda di nuovo">↻</button>
<div id="poster" role="button" aria-label="Riproduci"><div class="play"></div></div>

<audio id="snd" src="assets/audio.mp3" preload="auto"></audio>

<script>
(function () {
  'use strict';

  var SVGNS = 'http://www.w3.org/2000/svg';
  var DROP = 8;            // secondi di lezione tranquilla prima dell'audio
  var AUDIO_LEN = 11.2;    // durata di assets/audio.mp3, aggiornata quando arriva il file

  var scene = document.getElementById('scene');
  var cam = document.getElementById('cam');
  var spotlight = document.getElementById('spotlight');
  var curEl = document.getElementById('cur');
  var totEl = document.getElementById('tot');
  var fillEl = document.getElementById('fill');
  var poster = document.getElementById('poster');
  var replayBtn = document.getElementById('replay');

  /* --- numeri casuali ma sempre uguali: la classe non cambia a ogni apertura --- */
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }

  function el(tag, attrs, parent) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  /* --- parquet in prospettiva --- */
  (function () {
    var g = document.getElementById('planks');
    for (var x = -1500; x <= 2400; x += 110) el('path', { d: 'M450 330L' + x + ' 1600' }, g);
    for (var k = 1; k < 14; k++) {
      var y = 640 + k * k * 5.4;
      el('path', { d: 'M-600 ' + y + 'H1500' }, g);
    }
  })();

  /* --- banchi --- */
  (function () {
    var g = document.getElementById('desks');
    [70, 230, 600, 760].forEach(function (x) {
      el('rect', { x: x - 6, y: 640, width: 6, height: 52, fill: '#6b6f76' }, g);
      el('rect', { x: x + 120, y: 640, width: 6, height: 52, fill: '#6b6f76' }, g);
      el('rect', { x: x - 14, y: 622, width: 148, height: 20, rx: 3, fill: '#a8794d' }, g);
      el('rect', { x: x - 14, y: 638, width: 148, height: 5, fill: '#8a6140' }, g);
    });
  })();

  /* --- il cerchio --- */
  var N = 21, CX = 450, CY = 1090, RX = 372, RY = 290;
  var SKINS = ['#f1c7a5', '#e5b48f', '#c68a5e', '#8d5a3b', '#f6d5bd', '#d9a07a', '#b07450'];
  var HAIRS = ['#2b1b12', '#4a2c17', '#161210', '#7a4a22', '#c79a52', '#3a2a20', '#9b3b1f', '#e2c27a'];
  var SHIRTS = ['#3d6fb5', '#c0392b', '#2e8b57', '#e3b23c', '#7d4e9e', '#e07a5f', '#4a4a4a', '#efefef',
                '#1f7a8c', '#b5651d', '#5a7d3a', '#d35d8a', '#24354f', '#9fb7c9'];
  var PANTS = ['#34495e', '#2c3e50', '#5b6b7a', '#3b3b3b', '#6d5a45', '#4a5f86', '#7c8da0'];
  var CHAIR = '#2d4f86', CHAIR_D = '#223e6b', METAL = '#6b6f76';

  var people = [];
  for (var i = 0; i < N; i++) {
    var th = -Math.PI / 2 + i * 2 * Math.PI / N;
    var x = CX + RX * Math.cos(th), y = CY + RY * Math.sin(th);
    var depth = (y - (CY - RY)) / (2 * RY);       // 0 in fondo, 1 davanti
    people.push({
      i: i, x: x, y: y,
      s: 0.74 + 0.4 * depth,
      back: Math.sin(th) > 0.42,                    // quelli davanti si vedono di schiena
      her: i === 0,
      skin: pick(SKINS), hair: pick(HAIRS), shirt: pick(SHIRTS), pants: pick(PANTS),
      style: Math.floor(rnd() * 6), phone: rnd() < 0.35,
      ph: rnd() * 6.28, sp: 0.6 + rnd() * 0.8, blinkAt: 1 + rnd() * 4
    });
  }
  var HER = people[0];
  people.sort(function (a, b) { return a.y - b.y; });

  function hairBack(p, g) {
    if (p.style === 1) el('path', { d: 'M-26 -200a26 26 0 0 1 52 0v44q-26 9 -52 0z', fill: p.hair }, g);
    if (p.style === 3) el('circle', { cx: 0, cy: -203, r: 31, fill: p.hair }, g);
  }
  function hairFront(p, g) {
    var top = 'M-23 -197a23 23 0 0 1 46 0q-8 -11 -23 -12q-15 1 -23 12z';
    if (p.style === 0 || p.style === 1 || p.style === 3) el('path', { d: top, fill: p.hair }, g);
    if (p.style === 2) {
      el('path', { d: top, fill: p.hair }, g);
      el('circle', { cx: 0, cy: -226, r: 10, fill: p.hair }, g);
    }
    if (p.style === 4) el('path', { d: top, fill: p.hair, 'fill-opacity': 0.55 }, g);
    if (p.style === 5) {
      el('path', { d: 'M-23 -199a23 23 0 0 1 46 0z', fill: p.shirt }, g);
      el('path', { d: 'M-4 -199h34q2 5 -4 7h-30z', fill: p.shirt, 'fill-opacity': 0.85 }, g);
    }
  }

  function drawFront(p, root) {
    // schienale, gambe della sedia, seduta
    el('rect', { x: -38, y: -180, width: 76, height: 74, rx: 10, fill: CHAIR }, root);
    el('path', { d: 'M-34 -84L-37 0M34 -84L37 0M-26 -84L-23 -8M26 -84L23 -8', stroke: METAL, 'stroke-width': 4, 'stroke-linecap': 'round' }, root);
    el('rect', { x: -42, y: -94, width: 84, height: 13, rx: 5, fill: CHAIR_D }, root);
    // gambe della persona
    el('rect', { x: -24, y: -84, width: 18, height: 78, rx: 7, fill: p.pants }, root);
    el('rect', { x: 6, y: -84, width: 18, height: 78, rx: 7, fill: p.pants }, root);
    el('ellipse', { cx: -16, cy: -5, rx: 12, ry: 6, fill: '#2a2a2a' }, root);
    el('ellipse', { cx: 16, cy: -5, rx: 12, ry: 6, fill: '#2a2a2a' }, root);
    el('rect', { x: -27, y: -100, width: 54, height: 22, rx: 9, fill: p.pants }, root);
    // busto, braccia, mani
    el('path', { d: 'M-31 -160q31 -10 62 0l-3 70q-28 7 -56 0z', fill: p.shirt }, root);
    el('path', { d: 'M-29 -156q-9 30 -4 52q8 12 22 10M29 -156q9 30 4 52q-8 12 -22 10', fill: 'none', stroke: p.shirt, 'stroke-width': 14, 'stroke-linecap': 'round' }, root);
    if (p.phone) el('rect', { x: -10, y: -108, width: 20, height: 13, rx: 2, fill: '#1b1b1f' }, root);
    el('circle', { cx: -10, cy: -95, r: 6, fill: p.skin }, root);
    el('circle', { cx: 10, cy: -95, r: 6, fill: p.skin }, root);
    el('rect', { x: -7, y: -178, width: 14, height: 20, fill: p.skin }, root);
    // testa (girabile)
    var head = el('g', {}, root);
    hairBack(p, head);
    el('circle', { cx: 0, cy: -198, r: 22, fill: p.skin }, head);
    var eyes = el('g', {}, head);
    el('circle', { cx: -8, cy: -199, r: 2.7, fill: '#222' }, eyes);
    el('circle', { cx: 8, cy: -199, r: 2.7, fill: '#222' }, eyes);
    var smile = el('path', { d: 'M-6 -187q6 4 12 0', fill: 'none', stroke: '#7a3b2e', 'stroke-width': 2, 'stroke-linecap': 'round' }, head);
    var wow = el('ellipse', { cx: 0, cy: -186, rx: 4, ry: 5.5, fill: '#5a2620', display: 'none' }, head);
    hairFront(p, head);
    p.head = head; p.eyes = eyes; p.smile = smile; p.wow = wow;
  }

  function drawBack(p, root) {
    el('path', { d: 'M-34 -84L-37 0M34 -84L37 0M-26 -84L-23 -8M26 -84L23 -8', stroke: METAL, 'stroke-width': 4, 'stroke-linecap': 'round' }, root);
    el('rect', { x: -42, y: -94, width: 84, height: 13, rx: 5, fill: CHAIR_D }, root);
    el('path', { d: 'M-31 -160q31 -10 62 0l-3 70q-28 7 -56 0z', fill: p.shirt }, root);
    el('path', { d: 'M-29 -156q-9 30 -6 56M29 -156q9 30 6 56', fill: 'none', stroke: p.shirt, 'stroke-width': 14, 'stroke-linecap': 'round' }, root);
    el('rect', { x: -7, y: -178, width: 14, height: 20, fill: p.skin }, root);
    var head = el('g', {}, root);
    el('circle', { cx: 0, cy: -198, r: 22, fill: p.skin }, head);
    if (p.style === 1) el('path', { d: 'M-25 -200a25 25 0 0 1 50 0v42q-25 8 -50 0z', fill: p.hair }, head);
    else if (p.style === 3) el('circle', { cx: 0, cy: -203, r: 31, fill: p.hair }, head);
    else if (p.style === 5) {
      el('circle', { cx: 0, cy: -197, r: 22.5, fill: p.hair }, head);
      el('path', { d: 'M-23 -199a23 23 0 0 1 46 0z', fill: p.shirt }, head);
    } else {
      el('circle', { cx: 0, cy: -199, r: 23, fill: p.hair, 'fill-opacity': p.style === 4 ? 0.6 : 1 }, head);
      if (p.style === 2) el('circle', { cx: 0, cy: -226, r: 10, fill: p.hair }, head);
    }
    // da dietro lo schienale copre la schiena
    el('rect', { x: -38, y: -152, width: 76, height: 62, rx: 10, fill: CHAIR }, root);
    p.head = head;
  }

  function drawHer(p, root) {
    el('rect', { x: -40, y: -176, width: 80, height: 72, rx: 10, fill: CHAIR }, root);
    el('path', { d: 'M-34 -84L-37 0M34 -84L37 0M-26 -84L-23 -8M26 -84L23 -8', stroke: METAL, 'stroke-width': 4, 'stroke-linecap': 'round' }, root);
    el('rect', { x: -42, y: -94, width: 84, height: 13, rx: 5, fill: CHAIR_D }, root);
    // jeans chiari e scarpe
    el('rect', { x: -25, y: -84, width: 19, height: 78, rx: 7, fill: '#8796a6' }, root);
    el('rect', { x: 6, y: -84, width: 19, height: 78, rx: 7, fill: '#8796a6' }, root);
    el('ellipse', { cx: -16, cy: -5, rx: 12, ry: 6, fill: '#ececec' }, root);
    el('ellipse', { cx: 16, cy: -5, rx: 12, ry: 6, fill: '#ececec' }, root);
    el('rect', { x: -29, y: -102, width: 58, height: 24, rx: 9, fill: '#8796a6' }, root);
    // felpa nera sotto la foto: la foto finisce a meta' petto e continua qui
    el('path', { d: 'M-46 -128h92q-3 24 -8 38q-38 8 -76 0q-5 -14 -8 -38z', fill: '#2a2325' }, root);
    el('path', { d: 'M-22 -96q22 6 44 0', fill: 'none', stroke: '#3a3235', 'stroke-width': 2 }, root);
    // maniche che scendono fino alle mani, col telefono in mano (guarda giu' anche nella foto)
    el('path', { d: 'M-47 -128q-8 22 -2 30q10 8 34 0M47 -128q8 22 2 30q-10 8 -34 0', fill: 'none', stroke: '#1f1a1c', 'stroke-width': 15, 'stroke-linecap': 'round' }, root);
    el('rect', { x: -9, y: -114, width: 18, height: 26, rx: 3, fill: '#1b1b1f', transform: 'rotate(-12 0 -101) skewX(-8)' }, root);
    el('rect', { x: -7, y: -112, width: 14, height: 22, rx: 2, fill: '#9ec5ff', 'fill-opacity': 0.75, transform: 'rotate(-12 0 -101) skewX(-8)' }, root);
    el('circle', { cx: -12, cy: -97, r: 6.5, fill: '#e8b79c' }, root);
    el('circle', { cx: 11, cy: -99, r: 6.5, fill: '#e8b79c' }, root);
    // la foto: busto scontornato 560x493
    var head = el('g', {}, root);
    var img = el('image', { x: -60, y: -232, width: 120, height: 105.6, preserveAspectRatio: 'none' }, head);
    img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', 'assets/lei.webp');
    img.setAttribute('href', 'assets/lei.webp');
    p.head = head;
  }

  var peopleG = document.getElementById('people');
  people.forEach(function (p) {
    var g = el('g', { transform: 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ') scale(' + p.s.toFixed(3) + ')' }, peopleG);
    el('ellipse', { cx: 0, cy: 0, rx: 52, ry: 12, fill: '#000', 'fill-opacity': 0.16 }, g);
    if (p.her) drawHer(p, g); else if (p.back) drawBack(p, g); else drawFront(p, g);
    if (!p.her) {
      // il "!" che spunta sopra la testa quando parte l'audio
      var bang = el('g', { transform: 'translate(0 -250) scale(0)' }, g);
      el('circle', { r: 14, fill: '#fff', stroke: '#222', 'stroke-width': 2.5 }, bang);
      el('text', { y: 7.5, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 900, fill: '#d0342c', 'font-family': 'Arial Black, Arial, sans-serif' }, bang).textContent = '!';
      p.bang = bang;
    }
  });

  // dove guardare: il viso di lei nel mondo
  var HX = HER.x, HY = HER.y - 185 * HER.s;
  document.getElementById('spot').setAttribute('cx', HX.toFixed(1));
  document.getElementById('spot').setAttribute('cy', (HY + 20).toFixed(1));

  /* --- orologio vero --- */
  function clock() {
    var d = new Date(), s = d.getSeconds() + d.getMilliseconds() / 1000;
    var m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
    document.getElementById('hSec').setAttribute('transform', 'rotate(' + (s * 6) + ')');
    document.getElementById('hMin').setAttribute('transform', 'rotate(' + (m * 6) + ')');
    document.getElementById('hHour').setAttribute('transform', 'rotate(' + (h * 30) + ')');
  }

  /* --- audio: mp3 nel repo, spinto oltre il 100% con WebAudio --- */
  var sndEl = document.getElementById('snd');
  var ctx = null, srcNode = null;
  var blasting = false;   // lo sblocco non deve mettere in pausa il blast gia' partito

  sndEl.addEventListener('loadedmetadata', function () {
    if (isFinite(sndEl.duration) && sndEl.duration > 0) { AUDIO_LEN = sndEl.duration; showTotal(); }
  });

  function unlockAudio() {
    // il tocco su "play" serve a sbloccare: senza un gesto dell'utente
    // i browser (iOS in testa) non fanno partire l'audio dopo 8 secondi
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (!sndEl.dataset.unlocked) {
      sndEl.dataset.unlocked = '1';
      sndEl.muted = true;
      var pr = sndEl.play();
      if (pr && pr.then) {
        pr.then(function () {
          sndEl.muted = false;
          if (blasting) return;   // altrimenti la pausa qui sotto ammazza l'audio buono
          sndEl.pause();
          sndEl.currentTime = 0;
        }).catch(function () { sndEl.muted = false; });
      } else {
        sndEl.pause(); sndEl.currentTime = 0; sndEl.muted = false;
      }
    }
  }

  function blastAudio() {
    blasting = true;
    // il gain a 4 supera il volume massimo normale di un tag <audio>
    if (ctx && !srcNode) {
      try {
        srcNode = ctx.createMediaElementSource(sndEl);
        var boost = ctx.createGain();
        boost.gain.value = 4;
        srcNode.connect(boost);
        boost.connect(ctx.destination);
      } catch (e) { srcNode = null; }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    sndEl.muted = false;
    sndEl.volume = 1;
    sndEl.currentTime = 0;
    var p = sndEl.play();
    if (p && p.catch) p.catch(function () {});
  }

  function stopAudio() {
    blasting = false;
    try { sndEl.pause(); sndEl.currentTime = 0; } catch (e) {}
  }

  /* --- animazione: tutto dipende dal tempo t da quando si e' premuto play --- */
  var start = 0, playing = false, blasted = false, ended = false;

  function ease(x) { x = Math.max(0, Math.min(1, x)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function back(x) { x = Math.max(0, Math.min(1, x)); var c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function fmt(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function showTotal() { totEl.textContent = fmt(Math.ceil(DROP + AUDIO_LEN)); }

  function render(t) {
    var u = Math.max(0, t - DROP);              // tempo da quando parte l'audio
    var turn = ease(u / 0.5);                   // tutti si girano verso di lei
    var zoom = ease((u - 0.15) / 0.9);          // e la camera va su di lei

    // camera: lenta carrellata sul cerchio, poi dritta su di lei
    var s0 = 1 + 0.12 * Math.min(t, DROP) / DROP;
    var fx0 = 450, fy0 = 880 - 40 * Math.min(t, DROP) / DROP;
    var s = s0 + (3.1 - s0) * zoom;
    if (u > 1.1) s += 0.06 * Math.max(0, Math.sin((u - 1.1) * Math.PI * 2 * 1.8));   // pompa a tempo
    var fx = fx0 + (HX - fx0) * zoom, fy = fy0 + (HY + 25 - fy0) * zoom;
    cam.setAttribute('transform', 'translate(450 800) scale(' + s.toFixed(4) + ') translate(' + (-fx).toFixed(2) + ' ' + (-fy).toFixed(2) + ')');
    spotlight.setAttribute('opacity', (0.9 * ease((u - 0.4) / 0.8)).toFixed(3));

    var wall = Date.now() / 1000;
    people.forEach(function (p) {
      if (!p.head) return;
      var idle = Math.sin(wall * p.sp + p.ph);
      if (p.her) {
        // lei resta col telefono, dondola appena
        p.head.setAttribute('transform', 'rotate(' + (1.5 * idle).toFixed(2) + ' 0 -130)');
        return;
      }
      var dir = Math.max(-1, Math.min(1, (HX - p.x) / 160));
      var tilt = (p.phone ? 4 : 3) * idle * (1 - turn) + dir * (p.back ? 18 : 12) * turn;
      p.head.setAttribute('transform', 'rotate(' + tilt.toFixed(2) + ' 0 -178)');
      if (p.eyes) {
        var ex = (p.phone ? 0 : 1.5 * idle) * (1 - turn) + dir * 4.5 * turn;
        var ey = (p.phone ? 2.5 : 0) * (1 - turn) - 2 * turn;
        var blink = ((wall + p.blinkAt) % 4.3) < 0.13 ? 0.15 : 1;
        p.eyes.setAttribute('transform', 'translate(' + ex.toFixed(2) + ' ' + ey.toFixed(2) + ') translate(0 -199) scale(1 ' + blink + ') translate(0 199)');
        var shocked = turn > 0.5;
        p.smile.setAttribute('display', shocked ? 'none' : 'inline');
        p.wow.setAttribute('display', shocked ? 'inline' : 'none');
      }
      var b = back((u - 0.25 - (p.i % 5) * 0.06) / 0.35);
      p.bang.setAttribute('transform', 'translate(0 -250) scale(' + Math.max(0, b).toFixed(3) + ')');
    });

    var total = DROP + AUDIO_LEN;
    curEl.textContent = fmt(Math.min(t, total));
    fillEl.style.width = (100 * Math.min(1, t / total)).toFixed(2) + '%';
  }

  function frame() {
    clock();
    var t = playing ? (performance.now() - start) / 1000 : 0;
    if (playing && !blasted && t >= DROP) {
      blasted = true;
      blastAudio();
      scene.classList.add('shake');
      setTimeout(function () { scene.classList.remove('shake'); }, 1100);
    }
    if (playing && !ended && t >= DROP + AUDIO_LEN + 0.3) {
      ended = true;
      replayBtn.classList.remove('hidden');
    }
    render(t);
    requestAnimationFrame(frame);
  }

  function goFullscreen() {
    var e = document.documentElement;
    var fn = e.requestFullscreen || e.webkitRequestFullscreen;
    if (fn) { try { var r = fn.call(e); if (r && r.catch) r.catch(function () {}); } catch (err) {} }
  }

  function play() {
    unlockAudio();
    goFullscreen();
    poster.classList.add('hidden');
    replayBtn.classList.add('hidden');
    stopAudio();
    start = performance.now();
    playing = true; blasted = false; ended = false;
  }

  poster.addEventListener('click', play);
  replayBtn.addEventListener('click', function (e) { e.stopPropagation(); play(); });

  showTotal();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
